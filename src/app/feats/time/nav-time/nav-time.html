<nav class="navegacao-time" aria-label="Navegação do time">
    <button type="button" class="item-navegacao" [class.ativo]="abaAtiva() === 'kanban'" (click)="selecionarAba('kanban')">
        <span class="icone"><i class="fa-solid fa-table-columns"></i></span>
        <span>Kanban</span>
    </button>
    <button type="button" class="item-navegacao" [class.ativo]="abaAtiva() === 'tarefas'" (click)="selecionarAba('tarefas')">
        <span class="icone"><i class="fa-solid fa-list"></i></span>
        <span>Tarefas</span>
    </button>
    <button type="button" class="item-navegacao" [class.ativo]="abaAtiva() === 'calendario'" (click)="selecionarAba('calendario')">
        <span class="icone"><i class="fa-regular fa-calendar"></i></span>
        <span>Calendário</span>
    </button>
</nav>
