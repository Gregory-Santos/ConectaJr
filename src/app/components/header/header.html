  <div class="barra-pesquisa">
    <app-barra-pesquisa />
  </div>

<div class="chat-suspenso">
  <a routerLink="/chat-usuario" routerLinkActive="ativo" (click)="mensagemLida = true">
    
    <i class="fa-regular fa-comments"></i>
      @if (!mensagemLida) {
      <span class="contador-chat">5</span>
    }
  </a>
</div>

  <div class="notificacoes-suspenso">
    <button class="botao-notificacao" type="button" (click)="alternarNotificacoes()">
      <i class="fa-regular fa-bell"></i>

      @if (notificacoesNaoLidas > 0) {
      <span class="contador-notificacao">
        {{ notificacoesNaoLidas }}
      </span>
      }
    </button>

    @if (notificacoesAbertas) {
    <div class="painel-notificacoes">
      <div class="cabecalho-notificacoes">
        <h3>Notificações</h3>

        <button type="button" class="marcar-lidas" (click)="marcarTodasComoLidas()">
          Marcar como lidas
        </button>
      </div>

      <div class="lista-notificacoes">
        @for (notificacao of notificacoes; track notificacao.id) {
        <div class="notificacao" [class.nao-lida]="!notificacao.lida" (click)="marcarComoLida(notificacao.id)">
          <div class="icone-notificacao">
            <i class="fa-solid fa-bell"></i>
          </div>
          <div class="conteudo-notificacao">
            <strong>{{ notificacao.titulo }}</strong>
            <p>{{ notificacao.mensagem }}</p>
            <span>{{ notificacao.tempo }}</span>
          </div>
        </div>
        }
      </div>
    </div>
    }
  </div>

<div class="seletor-projeto">
    <div class="menu-projeto-atual" (click)="projetoAberto = !projetoAberto">
        <span>1774 | SENIOR SISTEMAS</span>
        <p>o</p>
        <i
            class="fa-solid fa-chevron-down"
            [class.aberta]="projetoAberto">
        </i>
    </div>

    <div class="opcoes-projeto" [hidden]="!projetoAberto">
        <div class="opcao-projeto">
            <span>1774 | SENIOR SISTEMAS</span>
            <i class="fa-solid fa-check"></i>
        </div>
    </div>
</div>
