<!--Construção do side bar inteiro-->
<div class="side-bar">

    <!--logo da conecta-->
    <div class="logo">
        <img src="/img/logo-conectajr.png" alt="logo do Conecta Júnior" routerLink="home">
    </div>

    <!--card de perfil, titulo perfil, avatar usuario, estudante, seta e nome de usuario-->
    <div class="titulo-perfil">
        <h1>Perfil</h1>
    </div>
    <div class="info-perfil" routerLink="/perfil" routerLinkActive="ativo">

        <img class="avatar-perfil" src="img/prof.henrique.jpg" alt="teste foto perfil" width="90">

        <div class="info">
            <h2>Henrique Delegrego</h2>
            <p>Estudante</p>

        </div>
        <i class="fa-solid fa-angle-down"></i>
    </div>


    <!--mini menu, inicio, dashboard, buscar e meu time-->
    <div class="mini-menu">
        <div class="titulo-menu">
            <h1>Menu</h1>
        </div>


        <nav class="icones">

            <div class="card-menu"> <a routerLink="/home" routerLinkActive="ativo"> <i class="fa-solid fa-house"></i>
                    <span>Início</span>
                </a></div>

            <div class="card-menu">
                <a routerLink="/dashboard" routerLinkActive="ativo"> <i class="fa-solid fa-border-all"></i> <span>Dashboard</span>
                </a>
            </div>

            <div class="card-menu">
                <a routerLink="/buscar" routerLinkActive="ativo"> <i class="fa-solid fa-magnifying-glass"></i> <span>Buscar</span>
                </a>
            </div>

            <div class="card-menu">
                <a routerLink="/time" routerLinkActive="ativo"> <i class="fa-solid fa-globe"></i> <span>Meu time</span>
                </a>
            </div>
        </nav>
    </div>

    <!--card de configuração-->
    <div class="outros-config">
        <div class="titulo-config">
            <h1>Configurações</h1>
        </div>

        <div class="card-config">
            <a routerLink="/config" routerLinkActive="ativo"> <i class="fa-solid fa-gear"></i>
                <span>Configurações</span>
            </a>
        </div>

    </div>

</div>
